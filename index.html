<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foods Create New Form</title>
<!-- PAGE-START -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;800&display=swap">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<!-- HEAD-END -->
</head>
<body>
<!--
  읽는 법
  - 화면(screen)이 8개 있고, 한 번에 하나만 보여.
  - style="--x:87; --y:274" 같은 숫자는 피그마 좌표(1440×1024 기준) 그대로야.
    --px, --py처럼 앞에 p가 붙은 건 휴대폰(세로 화면)용 좌표.
  - --w, --h는 너비·높이, --fs는 글자 크기.
-->
<div class="app" id="app">
  <div class="stage" id="stage">

    <!-- ===== 공통: 로고 (누르면 처음 화면) ===== -->
    <button class="logo abs box" id="logo" type="button" aria-label="처음 화면으로"
      style="--x:40; --y:47; --w:59; --h:50; --px:24; --py:32; --pw:52; --ph:44">
      <img src="assets/img/logo.png" alt="">
    </button>

    <!-- ===== 공통: 메뉴 (메인·갤러리에서만 보임) ===== -->
    <nav class="nav abs" id="nav" aria-label="메뉴" style="--x:147; --y:59; --px:100; --py:42">
      <button type="button" class="fs" data-nav="process" style="--fs:20; --pfs:22">Process</button>
      <button type="button" class="fs" data-nav="about" style="--fs:20; --pfs:22">About</button>
      <button type="button" class="fs" data-nav="gallery" style="--fs:20; --pfs:22">Gallery</button>
      <button type="button" class="fs" data-nav="create" style="--fs:20; --pfs:22">Create</button>
    </nav>

    <!-- ===== 화면 1: 메인 ===== -->
    <section class="screen" data-screen="home" aria-label="메인">
      <h1 class="hero-title abs fs" style="--x:87; --y:274; --fs:128; --px:40; --py:170; --pfs:84">FOODS<br>CREATE<br>NEW FORM</h1>
      <p class="hero-sub abs fs" style="--x:87; --y:741; --fs:32; --px:40; --py:482; --pfs:26">음식, 새로운 조형의 언어가 됩니다</p>

      <div class="plates" aria-hidden="true">
        <img class="plate abs box" src="assets/img/plate-top.png" alt="" style="--x:938; --y:149; --w:269; --h:269; --px:15; --py:715; --pw:190; --ph:190; --d:0s">
        <img class="plate abs box" src="assets/img/plate-top.png" alt="" style="--x:1148; --y:-17; --w:269; --h:269; --px:-135; --py:855; --pw:190; --ph:190; --d:-1.4s">
        <img class="plate abs box" src="assets/img/plate-top.png" alt="" style="--x:938; --y:687; --w:269; --h:269; --px:395; --py:715; --pw:190; --ph:190; --d:-2.6s">
        <img class="plate abs box" src="assets/img/plate-top.png" alt="" style="--x:1171; --y:836; --w:269; --h:269; --px:545; --py:855; --pw:190; --ph:190; --d:-3.3s">
      </div>
      <!-- 가운데 접시: 누르면 체험 시작 -->
      <button class="plate-start abs box" id="plateStart" type="button" aria-label="새로운 조형 만들기 시작"
        style="--x:852; --y:418; --w:269; --h:269; --px:190; --py:610; --pw:220; --ph:220">
        <img src="assets/img/plate-top.png" alt="">
        <img class="plate-logo" src="assets/img/logo.png" alt="">
      </button>
    </section>

    <!-- ===== 화면 2: 음식 고르기 (입력 + 사진 선택을 한 화면에서) =====
      A 입력 → 바로 아래에 사진이 뜸 → 하나 고르면 A 칸에 작게 들어가고 B로 넘어감 → B도 고르면 분석 시작
      (좌표는 임시. 피그마 디자인 나오면 바꾸기) -->
    <section class="screen" data-screen="pick" aria-label="음식 고르기">
      <h2 class="title cx fs" style="--cx:720; --y:118; --fs:48; --pcx:300; --py:120; --pfs:36">음식을 선택해주세요</h2>

      <form id="foodForm" autocomplete="off">
        <label class="pill abs box" id="pillA" data-side="A" style="--x:397; --y:214; --w:300; --h:64; --px:30; --py:190; --pw:262; --ph:64">
          <span class="pill-letter fs" style="--fs:24; --pfs:24">A</span>
          <span class="pill-caret" aria-hidden="true"></span>
          <input class="pill-input fs" id="foodA" name="foodA" type="text" maxlength="20" placeholder="음식 이름" aria-label="음식 A" style="--fs:22; --pfs:22" enterkeyhint="search">
          <img class="pill-thumb" alt="" hidden>
        </label>
        <label class="pill abs box" id="pillB" data-side="B" style="--x:743; --y:214; --w:300; --h:64; --px:308; --py:190; --pw:262; --ph:64">
          <span class="pill-letter fs" style="--fs:24; --pfs:24">B</span>
          <span class="pill-caret" aria-hidden="true"></span>
          <input class="pill-input fs" id="foodB" name="foodB" type="text" maxlength="20" placeholder="음식 이름" aria-label="음식 B" style="--fs:22; --pfs:22" enterkeyhint="search">
          <img class="pill-thumb" alt="" hidden>
        </label>
      </form>

      <p class="sub cx fs" id="pickSub" style="--cx:720; --y:302; --fs:20; --pcx:300; --py:280; --pfs:18">A에 섞고 싶은 음식을 입력하세요</p>
      <div class="car-track" id="carTrack" aria-roledescription="carousel"></div>
      <button class="btn-dark abs box fs" id="pickBtn" type="button"
        style="--x:574; --y:808; --w:293; --h:76; --fs:24; --px:140; --py:880; --pw:320; --ph:80; --pfs:24">이 사진으로 선택하기 →</button>
      <p class="note cx fs" id="pickNote" style="--cx:720; --y:910; --fs:14; --pcx:300; --py:984; --pfs:15"></p>
    </section>

    <!-- ===== 화면 4: 분석 중 (task3) ===== -->
    <section class="screen" data-screen="analyze" aria-label="분석 중">
      <h2 class="title cx fs" style="--cx:720; --y:164; --fs:48; --pcx:300; --py:140; --pfs:32">선택된 이미지를 분석중입니다</h2>
      <p class="sub cx fs" style="--cx:720; --y:233; --fs:20; --pcx:300; --py:186; --pfs:18">이미지 분석에는 시간이 소요됩니다</p>
      <div class="scan abs box" style="--x:263; --y:389; --w:340; --h:340; --px:150; --py:270; --pw:300; --ph:300">
        <img id="analyzeA" src="" alt="">
        <canvas id="materialA" aria-hidden="true"></canvas>
      </div>
      <div class="scan abs box" style="--x:846; --y:389; --w:340; --h:340; --px:150; --py:630; --pw:300; --ph:300">
        <img id="analyzeB" src="" alt="">
        <canvas id="materialB" aria-hidden="true"></canvas>
      </div>
    </section>

    <!-- ===== 화면 5: 새로운 조형 요리하기 (task4) ===== -->
    <section class="screen" data-screen="cook" aria-label="새로운 조형 요리하기">
      <h2 class="title cx fs" style="--cx:720; --y:115; --fs:48; --pcx:300; --py:110; --pfs:38">새로운 조형 요리하기</h2>
      <p class="sub cx fs" style="--cx:720; --y:184; --fs:20; --pcx:300; --py:164; --pfs:18">음식을 드래그하여 그릇안으로 넣어주세요</p>
      <img class="bowl abs box" id="cookBowl" src="assets/img/bowl.png" alt="" style="--x:211; --y:546; --w:1018; --h:509; --px:-10; --py:600; --pw:620; --ph:310">
      <div id="fragLayer"></div>
    </section>

    <!-- ===== 화면 6: 맛보기 조형 선택 (task5) ===== -->
    <section class="screen" data-screen="taste" aria-label="맛보기 조형 선택">
      <h2 class="title cx fs" style="--cx:720; --y:115; --fs:48; --pcx:300; --py:110; --pfs:36">맛보기 조형을 선택하세요</h2>
      <p class="sub cx fs" style="--cx:720; --y:184; --fs:20; --pcx:300; --py:160; --pfs:18">맛보고 싶은 조형을 클릭하세요</p>
      <div id="tasteLayer"></div>
      <!-- 조형이 만들어지는 동안 점이 맴돌다가, 도착하면 조형 모양으로 모임 (js/particles.js) -->
      <canvas class="taste-fx" id="tasteFx" aria-hidden="true"></canvas>
    </section>

    <!-- ===== 화면 7: 결과 3D 조형 (task6) ===== -->
    <section class="screen" data-screen="result" aria-label="결과 조형">
      <p class="sub cx fs" id="resultSub" style="--cx:720; --y:184; --fs:20; --pcx:300; --py:160; --pfs:18">마우스 왼쪽을 누르며 3D 조형을 돌려보세요</p>
      <div class="viewer abs box" id="viewer" style="--x:270; --y:236; --w:900; --h:660; --px:20; --py:220; --pw:560; --ph:640">
        <img class="viewer-fallback" id="resultImg" src="" alt="" hidden>
      </div>
      <p class="note cx fs" id="resultNote" style="--cx:720; --y:930; --fs:14; --pcx:300; --py:930; --pfs:15" hidden>보이지 않는 면은 AI가 추정한 형태예요</p>
      <!-- 관람객 평가: 누른 결과가 다음 관람객의 조형 제안에 반영됨 (좌표는 임시. 피그마 디자인 나오면 바꾸기) -->
      <div class="rate cx fs" id="resultRate" style="--cx:720; --y:962; --fs:16; --pcx:300; --py:964; --pfs:17" hidden>
        <span class="rate-q" id="rateQ">이 조형, 어땠어요?</span>
        <button class="rate-btn" type="button" data-rating="good">좋아요</button>
        <button class="rate-btn" type="button" data-rating="bad">별로예요</button>
      </div>
      <button class="arrow abs fs" id="resultNext" type="button" aria-label="처음 화면으로" style="--x:1363; --y:937; --fs:36; --px:524; --py:1010; --pfs:40">→</button>
    </section>

    <!-- ===== 화면 8: 갤러리 ===== -->
    <section class="screen" data-screen="gallery" aria-label="갤러리">
      <div class="g-feature abs box" style="--x:175; --y:285; --w:669; --h:435; --px:40; --py:180; --pw:520; --ph:338">
        <img id="gImg" src="" alt="">
      </div>
      <p class="g-no abs fs" id="gNo" style="--x:831; --y:638; --fs:22; --px:512; --py:500; --pfs:22"></p>
      <p class="g-name cx fs" id="gName" style="--cx:509; --y:756; --fs:21; --pcx:300; --py:545; --pfs:22"></p>
      <p class="g-date cx fs" id="gDate" style="--cx:509; --y:798; --fs:21; --pcx:300; --py:585; --pfs:20"></p>
      <div id="gPlates"></div>
    </section>

  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script type="module" src="js/app.js"></script>
<!-- PAGE-END -->
</body>
</html>
