<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FORMULA — 확인용</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  /* 확인용 페이지: 전시 화면이 아니라 작업자가 모든 화면을 한눈에 보고 바로 들어가 보는 곳
     작은 미리보기를 누르면 그 화면이 새 탭에서 열림 (?check: 스크롤 잠금·맨 처음 화면·2분 자동 초기화 없음) */
  :root { --ink: #1e1d1b; --sub: #8f8a80; --line: #e4e1da; --paper: #fafaf8; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--paper); color: var(--ink); font: 400 14px/1.6 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; padding: 40px 32px 80px; }
  h1 { font: 600 22px/1.3 'DM Sans', sans-serif; letter-spacing: .02em; }
  .lead { color: var(--sub); margin-top: 6px; }
  .lead b { color: var(--ink); font-weight: 600; }
  h2 { font: 600 15px/1.3 'DM Sans', sans-serif; letter-spacing: .04em; margin: 44px 0 14px; padding-top: 18px; border-top: 1px solid var(--line); }
  h2 small { font: 400 13px 'Pretendard', sans-serif; color: var(--sub); letter-spacing: 0; margin-left: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(288px, 1fr)); gap: 20px; }
  .hist { display: grid; grid-template-columns: 70px repeat(5, minmax(150px, 1fr)); gap: 12px; align-items: center; }
  .hist .no { font: 600 13px 'DM Sans', sans-serif; }
  .hist .head { font: 600 12px 'DM Sans', sans-serif; color: var(--sub); }
  /* 미리보기 한 칸: 1920×1080 화면을 줄여서 보여줌 */
  .tile { display: block; color: inherit; text-decoration: none; }
  .shot { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #fff; container-type: inline-size; }
  .shot iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; transform: scale(calc(100cqw / 1920px)); pointer-events: none; }
  @supports not (transform: scale(calc(100cqw / 1920px))) { .shot iframe { transform: scale(.15); } }
  .tile:hover .shot, .tile:focus-visible .shot { outline: 2px solid var(--ink); outline-offset: 2px; }
  .cap { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 13px; }
  .cap span { color: var(--sub); }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .links a { padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; color: inherit; text-decoration: none; font-size: 13px; }
  .links a:hover { border-color: var(--ink); }
  @media (max-width: 700px) { body { padding: 24px 16px 60px; } .hist { grid-template-columns: 1fr; } .hist .head { display: none; } }
</style>
</head>
<body>
<h1>FORMULA — 확인용</h1>
<p class="lead">전시용 화면이 아니라 <b>확인하는 화면</b>이야. 미리보기를 누르면 그 화면이 새 탭에서 열려.<br>
여기서 연 화면은 <b>맨 처음 화면(외곽선 로고) 없이 바로</b>, <b>스크롤 잠금 없이</b>, <b>2분 지나도 처음으로 안 돌아감</b>. 미리보기는 가벼우라고 3D 대신 평면 조형으로 보여.</p>
<div class="links">
  <a href="./" target="_blank" rel="noopener">전시 그대로 보기 (처음부터)</a>
  <a href="./?check" target="_blank" rel="noopener">메인 (확인용, 잠금 없음)</a>
  <a href="form-test.html" target="_blank" rel="noopener">3D 질감 시험 페이지</a>
</div>

<h2>메인 <small>장면별로 바로 열기</small></h2>
<div class="grid" id="main"></div>

<h2>다른 페이지</h2>
<div class="grid" id="pages"></div>

<h2>히스토리 <small>조형 8개 × 다섯 장 (조형 화면에서 조형을 누르면 나오는 화면)</small></h2>
<div class="hist" id="hist"></div>

<script src="foods.js"></script>
<script>
  // 미리보기 칸 만들기: thumb = 작은 미리보기 주소(3D 끔), open = 눌렀을 때 새 탭으로 열 주소
  const pad = (n) => String(n).padStart(2, '0');
  const tile = (title, note, page, hash = '') => {
    const q = page.includes('?') ? '&' : '?';
    return `<a class="tile" href="${page}${q}check${hash}" target="_blank" rel="noopener">
      <div class="shot"><iframe loading="lazy" tabindex="-1" aria-hidden="true" src="${page}${q}check&thumb${hash}"></iframe></div>
      <div class="cap"><b>${title}</b><span>${note}</span></div></a>`;
  };
  document.getElementById('main').innerHTML = [
    tile('첫 화면', '로고 해독 → 흰 화면 전환 → 소개글', './', '#story'),
    tile('OVERVIEW', '대화창 질문 두 개', './', '#overview'),
    tile('HOW IT WORKS', '다섯 장', './', '#process'),
    tile('조형 8개', '마우스 올리면 3D', './', '#forms'),
  ].join('');
  document.getElementById('pages').innerHTML = [
    tile('ARCHIVE', '카드가 저절로 뒤집힘', 'archive.html'),
    tile('ABOUT', '로고 구슬 격자', 'about.html'),
    tile('CONTACT', '', 'contact.html'),
  ].join('');
  const STEPS = ["Today's Food", 'Extract', 'Mix', 'Six Forms', 'Create form'];
  document.getElementById('hist').innerHTML = '<span></span>' + STEPS.map((s) => `<span class="head">${s}</span>`).join('') +
    window.FOODS.map((f, i) => `<span class="no">N ${pad(i + 1)}<br><small style="color:#8f8a80;font-weight:400">${f.foods.join(' × ')}</small></span>` +
      STEPS.map((s, k) => tile('', '', `history.html?n=${i + 1}`, `#${k + 1}`).replace('<div class="cap"><b></b><span></span></div>', '')).join('')).join('');
</script>
</body>
</html>
