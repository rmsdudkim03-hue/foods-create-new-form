<body class="hist-page">
<!-- 메뉴: 첫 페이지와 같은 자리 (흰 화면용 진한 글자) -->
<nav class="nav" aria-label="메뉴">

  <a class="archive light" href="./#archive">ARCHIVE</a>

</nav>

<!-- 내용은 history.js가 FORMS 자료로 채움 (조형 번호는 주소의 ?n=1~8) -->
<main class="hist" id="hist">
  <!-- 1장: 공식 한 줄 — 음식 → 특징 → 믹스 → 조형 여섯 → 오브제 -->
  <section class="h-flow">
    <a class="h-back" href="./#forms">← 8 FORMS</a>
    <h1 class="h-no" id="hNo">N 01</h1>
    <p class="h-sub">이 오브제는 이렇게 만들어졌어요</p>
    <ol class="flow" id="flow"></ol>
    <p class="legend"><i class="dot on"></i>사람이 정함 <i class="dot"></i>AI가 제안</p>
    <p class="h-formula" id="hFormula"></p>
  </section>

  <!-- 2장: 사람이 고른 세 순간 -->
  <section class="h-choice">
    <header class="hc-head">
      <p class="hc-no" id="hNo2">N 01</p>
      <h2>사람이 고른 세 순간</h2>
      <p class="h-sub">AI는 넓히고, 결정은 사람이 했습니다.</p>
    </header>
    <div class="choices" id="choices"></div>
    <nav class="h-pager" id="pager" aria-label="다른 오브제"></nav>
  </section>
</main>
<script src="history.js"></script>
