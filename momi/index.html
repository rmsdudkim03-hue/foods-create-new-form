  });

function swipe(el, drags, ctx) {
  let sx = 0, sy = 0, on = false, moved = false;
  el.addEventListener('pointerdown', e => {
    if (e.target.closest('.sc') || e.target.closest('.huedrag')) return;
    on = true; moved = false; sx = e.clientX; sy = e.clientY;
  });
  el.addEventListener('pointerup', e => {
    if (!on) return; on = false;
    const k = stage.getBoundingClientRect().width / 402;
    const dx = (e.clientX - sx) / k, dy = (e.clientY - sy) / k;
    if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
    const dir = dx < 0 ? 'LEFT' : 'RIGHT';
    const l = drags.find(d => d[10] === dir);
    // 밀었으면 그 뒤에 따라오는 '누르기'는 무시 (사진 위에서 밀어도 넘어가게)
    el._swiped = Date.now();
    if (l) { e.stopPropagation(); act(l, null, ctx); }
  });
  el.addEventListener('click', e => { if (Date.now() - (el._swiped || 0) < 400) { e.stopPropagation(); e.preventDefault(); } }, true);
  el.addEventListener('pointercancel', () => on = false);
}

const hist = [];

  if (busy) return;
  // '커스터마이징 완료하기'를 누르면 지금 캐릭터를 내 프로필로 저장
  if (nav === 'NAVIGATE' && F[curId] && F[curId].momai && l[6] > 700) myMomi = { src: F[curId].momai, filter: F[curId].colorDots && !(curId in BODY.pages) ? BODY.filter[bodyColor] : 'none' };
  if (nav === 'BACK') {
    if (ctx && ctx.overlay) return closeTop();
    return back();
  }
  if (nav === 'OVERLAY') {
    // 알림 배너처럼 위에 떠 있던 창에서 큰 창을 열면, 원래 창은 닫음
    if (ctx && ctx.lay && F[dest] && F[dest].ovBg) { const old = ctx.lay; openOverlay(dest, l, btn, ctx); close(old, true); return; }

// ── 모마이 몸 색: 고른 색을 기억해서 다른 부위(머리·얼굴·옷·신발·액세서리) 화면에서도 같은 색으로 ──
const BODY = { pages: { '3990:1692': 0, '3990:1919': 1, '3990:2146': 2, '3990:2827': 3, '3990:2600': 4, '3990:2373': 5, '3990:4434': -1, '3990:4661': -1 },

}
function colorDots(el, fid) {
  const onBody = fid in BODY.pages;   // 몸 화면: 색마다 따로 만든 피그마 화면으로 이동
  const ch = el._top; if (ch && !onBody) ch.style.filter = BODY.filter[bodyColor];

function go(fid, type, dir, push) {

  F[fid].links.filter(l => l[0] === 'AFTER_TIMEOUT').forEach(l => {

function animate(old, el, type, dir) {

// ── 홈 지도: 끌기, 확대·축소, 캐릭터 움직임 ──
function pan(p, el, ctx) {
  const vp = document.createElement('div'); vp.className = 'pan';
  const mp = document.createElement('div'); mp.className = 'map';
  mp.style.width = p.w + 'px'; mp.style.height = p.h + 'px';
  const bimg = img(p.base); bimg.style.width = p.w + 'px'; bimg.style.height = p.h + 'px'; mp.appendChild(bimg);
  p.sprites.forEach(s => {
    const d = document.createElement('div'); d.className = 'spr';
    Object.assign(d.style, { left: s.x + 'px', top: s.y + 'px', width: s.w + 'px', height: s.h + 'px', backgroundImage: `url(${src(s.sheet)})`, backgroundSize: `${s.cols * s.w}px auto` });
    d._s = s; mp.appendChild(d);
  });
  p.imgs.forEach(m => { const i = img(m.id); i.style.left = m.x + 'px'; i.style.top = m.y + 'px'; i.style.width = m.w + 'px'; i.style.height = m.h + 'px'; mp.appendChild(i); });
  const tint = document.createElement('div'); tint.className = 'tint';

  const apply = () => {

    const W = p.w * s, H = p.h * s;
    tx = Math.min(0, Math.max(402 - W, tx)); ty = Math.min(0, Math.max(874 - H, ty));

  };

      s = g.s * Math.hypot(p1[0] - p2[0], p1[1] - p2[1]) / g.d; s = Math.min(maxS, Math.max(minS, s)); tx = mx - g.lx * s; ty = my - g.ly * s; }
